[package]
name = "oxfmt_shim"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "oxfmt_shim"
crate-type = ["staticlib"]

[dependencies]
# The formatter backend has no usable registry release (every published
# version is yanked), so the workspace crates are pinned to one oxc
# release tag: `oxfmt_v*` tags are the only line that covers all four in a
# single workspace commit (the crates carry different version numbers -
# `oxc_formatter` tracks oxfmt's own version, the rest `crates_v*`).
# Bumping every entry to the same tag is mandatory: two tags mean two
# workspace commits, i.e. duplicate `oxc_span`/`oxc_allocator` crates from
# different sources that do not typecheck against each other.
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.80.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.80.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.80.0" }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.80.0" }

# Mirrors the oxc workspace's own release profile (the spike built inside
# it and inherited these); without it the archive ships fat with debug
# sections and unmerged generics.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
