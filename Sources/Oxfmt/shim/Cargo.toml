[package]
name = "canoe_shim"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "canoe_shim"
crate-type = ["staticlib"]

[dependencies]
# The formatter backend has no usable registry release (every published
# version is yanked), so the workspace crates are pinned to one oxc
# revision; cargo fetches it into `~/.cargo` like any git dependency.
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "a22c9f2abc74cbc00a75cf3d7ad6adeeb2a22fc1" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", rev = "a22c9f2abc74cbc00a75cf3d7ad6adeeb2a22fc1" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "a22c9f2abc74cbc00a75cf3d7ad6adeeb2a22fc1" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "a22c9f2abc74cbc00a75cf3d7ad6adeeb2a22fc1" }

# Mirrors the oxc workspace's own release profile (the spike built inside
# it and inherited these); without it the archive ships fat with debug
# sections and unmerged generics.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
