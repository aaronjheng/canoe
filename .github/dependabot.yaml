version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: github.com/tree-sitter/swift-tree-sitter
      - dependency-name: github.com/tree-sitter/tree-sitter
      - dependency-name: github.com/tree-sitter-grammars/tree-sitter-lua
      - dependency-name: github.com/tree-sitter/tree-sitter-javascript
    groups:
      swift:
        patterns:
          - "*"
